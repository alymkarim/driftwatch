name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: driftwatch-linux
          - os: macos-latest
            asset: driftwatch-macos
          - os: windows-latest
            asset: driftwatch-windows.exe
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache build
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/driftwatch.exe "dist/${{ matrix.asset }}"
          else
            cp target/release/driftwatch "dist/${{ matrix.asset }}"
            chmod +x "dist/${{ matrix.asset }}"
          fi

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ matrix.asset }}
          draft: false
          generate_release_notes: true
